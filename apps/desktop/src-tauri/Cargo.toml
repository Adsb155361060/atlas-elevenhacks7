[package]
name = "atlas-desktop"
version = "0.0.1"
description = "Atlas — voice-first desktop AI assistant"
authors = ["Atlas Contributors"]
edition = "2021"
license = "MIT"
rust-version = "1.83"

[lib]
name = "atlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
log = "0.4"
# Wake-word detection (Phase 0.D; ADR 0019)
livekit-wakeword = "0.1"
cpal = "0.15"
crossbeam-channel = "0.5"
# Voice loop — WebSocket to ElevenLabs Conversational Agent (Phase 0.E)
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
url = "2"
# IVC voice cloning + voice prefs persistence (Phase 0.F)
hound = "3"
bytes = "1"
# Tools — Phase 1
fuzzy-matcher = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
