name = "atlas-worker"
main = "src/index.ts"
compatibility_date = "2024-12-15"
compatibility_flags = ["nodejs_compat"]

# Set via `wrangler secret put NAME` — never in this file:
#   GEMINI_API_KEY           required — chat completions backbone
#   ALLOWED_AGENT_TOKENS     required — bearer tokens the desktop sends
#   ANTHROPIC_API_KEY        optional — only the legacy vision_qa route uses it
#   ELEVENLABS_API_KEY       optional
#   VOYAGE_API_KEY           optional
#   BRAVE_SEARCH_API_KEY     optional

[vars]
WORKER_VERSION = "0.0.3"
# Use the strongest Gemini model first; on 429/5xx/model-not-found the
# worker auto-falls-back to FALLBACK_LLM_MODEL without surfacing the error.
# Gemini 3 Flash Preview requires thoughtSignature roundtripping on
# every prior functionCall in the conversation history. The OpenAI
# Chat-Completions wire format ElevenLabs uses can't carry those
# signatures, so multi-turn-with-tool-use chats hit a 400 on the second
# LLM call. Until we implement signature preservation, stay on 2.5 Flash
# which has no such requirement.
DEFAULT_LLM_MODEL = "gemini-2.5-flash"
FALLBACK_LLM_MODEL = "gemini-2.5-flash-lite"
ROUTER_TOOL_MODEL = "gemini-2.5-flash"
ROUTER_TRIAGE_MODEL = "gemini-2.5-flash-lite"
DEFAULT_ANTHROPIC_MODEL = "claude-opus-4-7"   # legacy — vision_qa only
DAILY_LLM_BUDGET_USD = "20"
LOG_LEVEL = "info"
# Per-IP rate-limit for the Path-A judges build. Counts requests against
# ATLAS_RATELIMIT KV; returns 429 once exceeded.
RATE_LIMIT_PER_DAY = "200"

# Observability: enable workers analytics + tail logs
[observability]
enabled = true

# Per-IP rate limit counters (Path A judges build).
[[kv_namespaces]]
binding = "ATLAS_RATELIMIT"
id = "fadc34344ba84095a75e4fab9a0cc778"

# KV / R2 bindings reserved for later phases (artifact storage, blob cache):
# [[kv_namespaces]]
# binding = "ARTIFACT_KV"
# id = "TBD"
#
# [[r2_buckets]]
# binding = "BLOBS"
# bucket_name = "atlas-blobs"
