name: release-desktop

# Build the Atlas desktop bundle and attach to a GitHub Release.
#
# Trigger:
#   - Tag push matching `v*` (e.g. `v0.1.0`) builds + publishes.
#   - workflow_dispatch lets you run it manually from the Actions tab to
#     produce an unattached test artifact.
#
# Targets macOS + Windows for now. Linux follows once we've validated
# this path.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # to create + upload release assets

jobs:
  build-macos:
    name: macOS universal (.dmg)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Rust toolchain (with both apple targets for universal)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm --filter @atlas/desktop typecheck

      - name: Build Tauri (universal-apple-darwin)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Path A — bake the four runtime config values into the binary.
          # `build.rs` reads these and writes `bundled_config.rs`; the app
          # hydrates `std::env` from them at startup. Install → talk, no
          # setup. Worker rate-limit caps abuse.
          # See README "Quick start" + ADR-style note in commit history.
          ATLAS_BAKED_WORKER_URL: ${{ secrets.BAKED_WORKER_URL }}
          ATLAS_BAKED_AGENT_TOKEN: ${{ secrets.BAKED_AGENT_TOKEN }}
          ATLAS_BAKED_AGENT_ID: ${{ secrets.BAKED_AGENT_ID }}
          ATLAS_BAKED_ELEVENLABS_API_KEY: ${{ secrets.BAKED_ELEVENLABS_API_KEY }}
          # Intentionally unsigned. Adding the APPLE_* secrets here makes
          # tauri-action try to import a keychain certificate; with stale
          # / partial secrets that fails and breaks the whole build.
          # Users open the .app via right-click → Open (one-time
          # Gatekeeper prompt). Documented in README + release body.
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Atlas ${{ github.ref_name }}'
          releaseBody: |
            Universal macOS bundle + Windows x64 bundle for Atlas.
            See `README.md` → **Quick start** section.

            **macOS first launch:** right-click the .app → Open → "Open"
            again at the Gatekeeper prompt.

            **Windows first launch:** the SmartScreen prompt appears →
            click "More info" → "Run anyway".

            Unsigned early-release build — no Apple Developer / EV cert.
          releaseDraft: false
          prerelease: true
          args: --target universal-apple-darwin

  build-windows:
    name: Windows x64 (.msi + .exe)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm --filter @atlas/desktop typecheck

      - name: Build Tauri (x86_64-pc-windows-msvc)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same Path A baked-config story as the macOS job.
          ATLAS_BAKED_WORKER_URL: ${{ secrets.BAKED_WORKER_URL }}
          ATLAS_BAKED_AGENT_TOKEN: ${{ secrets.BAKED_AGENT_TOKEN }}
          ATLAS_BAKED_AGENT_ID: ${{ secrets.BAKED_AGENT_ID }}
          ATLAS_BAKED_ELEVENLABS_API_KEY: ${{ secrets.BAKED_ELEVENLABS_API_KEY }}
          # Intentionally unsigned. Users will see a SmartScreen prompt on
          # first launch — click "More info" → "Run anyway". Documented in
          # README + release body.
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Atlas ${{ github.ref_name }}'
          releaseBody: |
            Universal macOS bundle + Windows x64 bundle for Atlas.
            See `README.md` → **Quick start** section.

            **macOS first launch:** right-click the .app → Open → "Open"
            again at the Gatekeeper prompt.

            **Windows first launch:** the SmartScreen prompt appears →
            click "More info" → "Run anyway".

            Unsigned early-release build — no Apple Developer / EV cert.
          releaseDraft: false
          prerelease: true
          args: --target x86_64-pc-windows-msvc

  build-linux:
    name: Linux x64 (.deb + .AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: System dependencies for Tauri + cpal
        # Tauri's Linux bundle requires webkit2gtk; cpal needs ALSA headers.
        # `libayatana-appindicator3-dev` is what the tray plugin uses on
        # modern Ubuntu (libappindicator3-dev was retired in 22.04+).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            file

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm --filter @atlas/desktop typecheck

      - name: Build Tauri (x86_64-unknown-linux-gnu)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same Path A baked-config story as the macOS + Windows jobs.
          ATLAS_BAKED_WORKER_URL: ${{ secrets.BAKED_WORKER_URL }}
          ATLAS_BAKED_AGENT_TOKEN: ${{ secrets.BAKED_AGENT_TOKEN }}
          ATLAS_BAKED_AGENT_ID: ${{ secrets.BAKED_AGENT_ID }}
          ATLAS_BAKED_ELEVENLABS_API_KEY: ${{ secrets.BAKED_ELEVENLABS_API_KEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Atlas ${{ github.ref_name }}'
          releaseBody: |
            macOS / Windows / Linux bundles for Atlas.
            See `README.md` → **Quick start** section.

            **macOS first launch:** right-click the .app → Open → "Open"
            again at the Gatekeeper prompt.

            **Windows first launch:** the SmartScreen prompt appears →
            click "More info" → "Run anyway".

            **Linux:** install the .deb with `sudo dpkg -i Atlas_*.deb` or
            mark the .AppImage executable and run it. Requires
            `libwebkit2gtk-4.1-0` and `libayatana-appindicator3-1`
            on the target machine (preinstalled on most modern desktops).
          releaseDraft: false
          prerelease: true
          args: --target x86_64-unknown-linux-gnu --bundles deb,appimage
